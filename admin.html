<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Fotos · Ruma Cartas</title>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--brand:#4B2E83;--brand-m:#8E64E2;--sec:#FFB727;--bg:#FFF8D8;--ink:#131316;--card:#fff;--line:rgba(75,46,131,.16);--muted:#5b5470;--ok:#1fa35b;--red:#FF3B3B}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:Quicksand,system-ui,sans-serif;font-weight:600;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.display{font-family:'Luckiest Guy';font-weight:400;letter-spacing:.02em}
header{background:var(--brand);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
header h1{font-size:24px;color:var(--sec);text-shadow:2px 2px 0 #131316}
header .sp{flex:1}
.btn{background:var(--sec);color:#131316;border:2px solid #131316;border-radius:12px;padding:9px 16px;font-weight:700;box-shadow:3px 3px 0 #131316}
.btn.ghost{background:transparent;color:inherit;border-color:currentColor;box-shadow:none}
.btn[disabled]{opacity:.5;pointer-events:none}
.login{max-width:380px;margin:12vh auto;padding:24px;background:var(--card);border:3px solid #131316;border-radius:22px;box-shadow:8px 8px 0 #131316;display:flex;flex-direction:column;gap:12px}
.login h2{font-size:30px;color:var(--brand)}
.login input{padding:12px;border-radius:12px;border:2px solid var(--line);background:transparent}
.msg{font-size:14px;min-height:20px}
.msg.err{color:var(--red)}.msg.ok{color:var(--ok)}
main{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px}
@media(max-width:820px){main{grid-template-columns:minmax(0,1fr)}.list{max-height:none}.rows{max-height:42vh}header h1{font-size:19px}#who{display:none}header .sp{display:none}}
.drop,.pane,.list{min-width:0}
.back{display:none}@media(max-width:820px){.back{display:inline-flex;align-self:flex-start}}
.list{background:var(--card);border:2px solid var(--line);border-radius:18px;overflow:hidden;max-height:calc(100vh - 110px);display:flex;flex-direction:column}
.filters{padding:10px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line)}
.filters button{padding:6px 12px;border-radius:999px;border:2px solid var(--brand);background:transparent;font-weight:700;font-size:13px}
.filters button[aria-pressed=true]{background:var(--brand);color:#fff}
.rows{overflow:auto}
.r{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.r:hover,.r.sel{background:rgba(142,100,226,.16)}
.r .n{grid-column:1;line-height:1.25}
.r .s{grid-column:2;grid-row:1/3;align-self:center;display:flex;gap:4px}
.dot{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;border:2px solid var(--line);color:var(--muted)}
.dot.on{background:var(--ok);border-color:var(--ok);color:#fff}
.r .m{color:var(--muted);font-size:12px}
.pane{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.pane h2{font-size:17px;line-height:1.3}
.facts{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px}
.drops{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:520px){.drops{grid-template-columns:1fr}}
.drop{border:3px dashed var(--brand-m);border-radius:18px;aspect-ratio:3/4;display:grid;place-items:center;text-align:center;padding:10px;position:relative;overflow:hidden;background:rgba(142,100,226,.07);cursor:pointer}
.drop.over{background:rgba(255,183,39,.25)}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#2e1b57}
.drop .lbl{position:absolute;left:8px;top:8px;background:var(--sec);color:#131316;border:2px solid #131316;border-radius:9px;padding:1px 9px;font-size:12px;font-weight:700;z-index:2}
.drop .bar{position:absolute;left:0;bottom:0;height:6px;background:var(--ok);width:0;transition:width .2s;z-index:3}
.drop input{display:none}
.xdel{position:absolute;right:8px;top:8px;z-index:4;width:34px;height:34px;border-radius:50%;border:2px solid #131316;background:#fff;color:#c0262d;font-size:18px;font-weight:700;cursor:pointer;line-height:1}
.hint{font-size:13px;color:var(--muted);font-weight:500}
.box{border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.box h3{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.in{padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:transparent;min-width:0}
.in.num{width:110px}
.step{width:38px;height:38px;border-radius:10px;border:2px solid var(--brand);background:transparent;font-size:20px;font-weight:700}
.big{font-size:22px;min-width:34px;text-align:center}
.btn.ok{background:var(--ok);color:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.anul{opacity:.45;text-decoration:line-through}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.kpi{border:2px solid var(--line);border-radius:14px;padding:10px 16px;background:var(--card)}
.kpi b{display:block;font-size:22px;color:var(--brand)}
.empty{color:var(--muted);padding:40px 10px;text-align:center}
</style>
</head>
<body>
<header><h1 class="display">RUMA · Fotos de cartas</h1><nav id="nav" hidden style="display:flex;gap:6px"><button class="btn ghost" id="vCartas" style="padding:6px 12px">Cartas</button><button class="btn ghost" id="vVentas" style="padding:6px 12px">Ventas</button></nav><div class="sp"></div><span id="who" style="font-size:13px"></span><button class="btn ghost" id="out" hidden>Salir</button></header>

<section id="loginBox" class="login" hidden>
  <h2 class="display">Entrar</h2>
  <p class="hint">Solo el correo de Ruma puede subir fotos.</p>
  <input id="em" type="email" placeholder="correo" autocomplete="username">
  <input id="pw" type="password" placeholder="contraseña (mín. 8)" autocomplete="current-password">
  <button class="btn" id="go">Entrar</button>
  <div class="msg" id="lmsg"></div>
</section>

<main id="app" hidden>
  <div class="list">
    <button class="btn ok" id="nueva" style="width:100%;margin-bottom:8px">+ Nueva carta</button>
    <div class="filters" id="filters"></div>
    <div class="rows" id="rows"></div>
  </div>
  <div class="pane" id="pane"><div class="empty">Elige una carta de la lista.</div></div>
</main>

<section id="ventasView" hidden style="max-width:1100px;margin:0 auto;padding:16px"></section>

<script>
'use strict';
const SB_URL='https://jfekxykuasvmanmolbwg.supabase.co';
const SB_KEY='sb_publishable_0tjN9mXrJJzLRGt_c51QxQ_mDV9FTph';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[kk,v]of Object.entries(a)){if(kk==='class')e.className=v;else if(kk.startsWith('on'))e.addEventListener(kk.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(kk,v)}k.flat().forEach(c=>e.append(c?.nodeType?c:document.createTextNode(c??'')));return e};
let cartas=[],filtro='Todas',sel=null,orden='za';

async function boot(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session){$('#loginBox').hidden=false;$('#app').hidden=true;$('#nav').hidden=true;$('#out').hidden=true;return}
  $('#loginBox').hidden=true;$('#nav').hidden=false;$('#who').textContent=session.user.email;$('#out').hidden=false;
  const{data,error}=await sb.rpc('admin_listar');
  if(error){$('#app').hidden=true;$('#loginBox').hidden=false;msg('Esta cuenta no tiene permiso. Entra con el correo de Ruma.',1);await sb.auth.signOut();$('#out').hidden=true;return}
  cartas=data;$('#app').hidden=false;renderList();if(sel)renderPane();
}
const msg=(t,err)=>{const m=$('#lmsg');m.textContent=t;m.className='msg '+(err?'err':'ok')};
$('#go').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)msg(error.message.includes('confirm')?'Falta confirmar el correo (revisa tu bandeja).':'Correo o contraseña incorrectos.',1);else boot()};
$('#out').onclick=async()=>{await sb.auth.signOut();sel=null;boot()};

function renderList(){
  const fs=$('#filters');fs.replaceChildren();
  ['Todas','PSA','CGC','Chinas','Sin foto'].forEach(f=>fs.append(el('button',{'aria-pressed':String(f===filtro),onclick:()=>{filtro=f;renderList()}},f)));
  const ord=el('select',{class:'in','aria-label':'Ordenar',style:'width:100%;margin-top:4px',onchange:e=>{orden=e.target.value;renderList()}},
    [['za','Orden: Z → A (agotadas al final)'],['az','Orden: A → Z (agotadas al final)'],['pv','Orden: mayor precio (agotadas al final)']].map(([v,t])=>el('option',{value:v,selected:v===orden},t)));
  fs.append(ord);
  const rows=$('#rows');rows.replaceChildren();
  const cmp=(a,b)=>{
    const ag=(a.stock>0?0:1)-(b.stock>0?0:1); if(ag)return ag;
    if(orden==='pv')return (b.pv||0)-(a.pv||0)||a.nombre.localeCompare(b.nombre,'es',{sensitivity:'base'});
    const r=a.nombre.localeCompare(b.nombre,'es',{sensitivity:'base',numeric:true});
    return orden==='za'?-r:r;
  };
  cartas.filter(c=>filtro==='Todas'||(filtro==='Sin foto'?!c.foto_frente:c.empresa===filtro)).sort(cmp).forEach(c=>{
    rows.append(el('div',{class:'r'+(sel===c.id?' sel':''),onclick:()=>{sel=c.id;renderList();renderPane();if(innerWidth<=820)$('#pane').scrollIntoView({behavior:'smooth',block:'start'})}},
      el('div',{class:'n'},c.nombre),
      el('div',{class:'s'},el('span',{class:'dot'+(c.foto_frente?' on':''),title:'Frente'},'F'),el('span',{class:'dot'+(c.foto_dorso?' on':''),title:'Dorso'},'D')),
      el('div',{class:'m'},`${c.empresa} ${c.grado||''} · PV ${c.pv?'S/ '+c.pv:'—'}${c.stock>0?' · stock '+c.stock:' · agotada'}`)));
  });
}

function renderPane(){
  const c=cartas.find(x=>x.id===sel);if(!c)return;
  const visible=c.pv&&c.stock>0&&c.foto_frente;
  const pvIn=el('input',{class:'in num',type:'number',min:'0',step:'1',inputmode:'numeric',value:c.pv??'',placeholder:'S/'});
  const nomIn=el('input',{class:'in',value:c.nombre,maxlength:'200',style:'flex:1;min-width:200px'});
  const stockN=el('span',{class:'big'},String(c.stock));
  const rpc=async(fn,args,ok)=>{const{error}=await sb.rpc(fn,args);if(error)return alert('No se pudo: '+error.message);await boot();if(ok)ok()};
  const venta=el('div',{class:'box',hidden:true});
  const vp=el('input',{class:'in num',type:'number',min:'0',step:'1',value:c.pv??''});
  const vc=el('select',{class:'in'},['WhatsApp','Instagram','TikTok','Tienda / en persona','Otro'].map(x=>el('option',{},x)));
  const vcl=el('input',{class:'in',placeholder:'Cliente (opcional)',maxlength:'120'});
  const vn=el('input',{class:'in',placeholder:'Nota (opcional)',maxlength:'300',style:'flex:1;min-width:160px'});
  venta.append(el('h3',{},'Registrar venta'),
    el('div',{class:'line'},el('span',{},'Precio final S/'),vp,vc),
    el('div',{class:'line'},vcl,vn),
    el('div',{class:'line'},el('button',{class:'btn ok',onclick:()=>{if(!(+vp.value>=0)||vp.value==='')return alert('Pon el precio final');rpc('admin_registrar_venta',{p_id:c.id,p_precio:+vp.value,p_canal:vc.value,p_cliente:vcl.value,p_nota:vn.value},()=>alert('Venta registrada. Stock descontado.'))}},'Confirmar venta'),
      el('button',{class:'btn ghost',style:'color:inherit',onclick:()=>venta.hidden=true},'Cancelar')));
  $('#pane').replaceChildren(
    el('button',{class:'btn ghost back',style:'color:inherit;padding:6px 12px',onclick:()=>$('.list').scrollIntoView({behavior:'smooth'})},'← Lista'),
    el('h2',{},c.nombre),
    el('div',{class:'box'},el('h3',{},'Nombre'),
      el('div',{class:'line'},nomIn,el('button',{class:'btn',onclick:()=>{if(nomIn.value.trim().length<3)return alert('Nombre muy corto');rpc('admin_set_nombre',{p_id:c.id,p_nombre:nomIn.value})}},'Guardar nombre'))),
    el('div',{class:'facts'},el('span',{class:'chip'},`${c.empresa} ${c.grado||''}`),
      c.precio_mercado?el('span',{class:'chip'},'Mercado ref.: S/ '+c.precio_mercado):null,
      el('span',{class:'chip'},visible?'✅ Visible en el catálogo':'⏳ No visible: falta '+[!c.pv&&'PV',!(c.stock>0)&&'stock',!c.foto_frente&&'foto de frente'].filter(Boolean).join(', '))),
    el('div',{class:'box'},el('h3',{},'Precio y stock'),
      el('div',{class:'line'},el('span',{},'PV S/'),pvIn,el('button',{class:'btn',onclick:()=>rpc('admin_set_precio',{p_id:c.id,p_pv:pvIn.value===''?null:+pvIn.value})},'Guardar precio')),
      el('div',{class:'line'},el('span',{},'Stock'),el('button',{class:'step',onclick:()=>rpc('admin_set_stock',{p_id:c.id,p_stock:Math.max(0,c.stock-1)})},'−'),stockN,el('button',{class:'step',onclick:()=>rpc('admin_set_stock',{p_id:c.id,p_stock:c.stock+1})},'+'),
        el('button',{class:'btn',style:'margin-left:auto',disabled:c.stock<1,onclick:()=>{venta.hidden=false}},'Registrar venta'))),
    venta,
    el('div',{class:'drops'},drop(c,'frente'),drop(c,'dorso')),
    el('p',{class:'hint'},'Foto de frente obligatoria; dorso opcional. Se sube en alta calidad (hasta 2400 px) y se crea sola una versión liviana.'));
}

$('#nueva').onclick=()=>{
  sel=null;renderList();
  const n=el('input',{class:'in',placeholder:'Nombre completo (ej. 2023 POKEMON ... CHARIZARD PSA 10)',maxlength:'200',style:'flex:1;min-width:220px'});
  const e=el('select',{class:'in'},['PSA','CGC','Chinas'].map(x=>el('option',{},x)));
  const g=el('input',{class:'in',placeholder:'Grado (ej. 10)',maxlength:'20',style:'width:110px'});
  const p=el('input',{class:'in num',type:'number',min:'0',step:'1',inputmode:'numeric',placeholder:'PV S/'});
  const s=el('input',{class:'in num',type:'number',min:'0',step:'1',inputmode:'numeric',value:'1'});
  $('#pane').replaceChildren(el('h2',{},'Nueva carta'),
    el('div',{class:'box'},
      el('div',{class:'line'},n),
      el('div',{class:'line'},el('span',{},'Empresa'),e,g),
      el('div',{class:'line'},el('span',{},'PV S/'),p,el('span',{},'Stock'),s),
      el('div',{class:'line'},el('button',{class:'btn ok',onclick:async()=>{
        if(n.value.trim().length<3)return alert('Falta el nombre');
        const{data,error}=await sb.rpc('admin_crear_carta',{p_nombre:n.value,p_empresa:e.value,p_grado:g.value,p_pv:p.value===''?null:+p.value,p_stock:s.value===''?1:+s.value});
        if(error)return alert('No se pudo: '+error.message);
        sel=data;await boot();
      }},'Crear carta'))),
    el('p',{class:'hint'},'Al crearla se abre su ficha para subir la foto de frente. Se verá en el catálogo con PV, stock y foto.'));
};

function drop(c,lado){
  const url=c['foto_'+lado];
  const box=el('div',{class:'drop',tabindex:'0'});
  const bar=el('div',{class:'bar'});
  const input=el('input',{type:'file',accept:'image/*'});
  box.append(el('span',{class:'lbl'},lado==='frente'?'FRENTE':'DORSO'));
  if(url){box.append(el('img',{src:url+'',alt:lado}),el('button',{class:'xdel',title:'Quitar foto','aria-label':'Quitar foto '+lado,onclick:async e=>{e.stopPropagation();if(!confirm('¿Quitar la foto de '+lado+'?'))return;const{error}=await sb.rpc('admin_set_foto',{p_id:c.id,p_lado:lado,p_url:null,p_mini:null});if(error)return alert('No se pudo: '+error.message);boot()}},'✕'))}else box.append(el('div',{},'Suelta aquí la foto del ',lado,el('br'),el('span',{class:'hint'},'o toca para elegir')));
  box.append(bar,input);
  input.onclick=e=>e.stopPropagation();
  box.onclick=()=>input.click();
  box.ondragover=e=>{e.preventDefault();box.classList.add('over')};box.ondragleave=()=>box.classList.remove('over');
  box.ondrop=e=>{e.preventDefault();box.classList.remove('over');if(e.dataTransfer.files[0])subir(c,lado,e.dataTransfer.files[0],bar)};
  input.onchange=()=>input.files[0]&&subir(c,lado,input.files[0],bar);
  return box;
}

async function cargarImg(file){
  const url=URL.createObjectURL(file);
  try{
    return await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>ko(new Error('Este formato de foto no se puede leer. Prueba con una foto normal (JPG).'));i.src=url});
  }finally{setTimeout(()=>URL.revokeObjectURL(url),30000)}
}
async function redim(file,max,q){
  let src;
  try{src=await cargarImg(file)}catch(e){try{src=await createImageBitmap(file)}catch(_){throw e}}
  const w=src.naturalWidth||src.width,h=src.naturalHeight||src.height;
  const k=Math.min(1,max/Math.max(w,h));
  const cv=document.createElement('canvas');cv.width=Math.round(w*k);cv.height=Math.round(h*k);
  cv.getContext('2d').drawImage(src,0,0,cv.width,cv.height);
  return new Promise((ok,ko)=>cv.toBlob(b=>b?ok(b):ko(new Error('No se pudo procesar la foto')),'image/jpeg',q));
}

async function subir(c,lado,file,bar){
  try{
    bar.style.width='10%';
    const full=await redim(file,2400,.9);const mini=await redim(file,700,.82);
    bar.style.width='35%';
    const base=`${c.airtable_id||c.id}/${lado}-${Date.now()}`;
    const up=async(path,blob)=>{const{error}=await sb.storage.from('cartas').upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000',upsert:false});if(error)throw error;return sb.storage.from('cartas').getPublicUrl(path).data.publicUrl};
    const u1=await up(base+'.jpg',full);bar.style.width='70%';
    const u2=await up(base+'_m.jpg',mini);bar.style.width='90%';
    const{error}=await sb.rpc('admin_set_foto',{p_id:c.id,p_lado:lado,p_url:u1,p_mini:u2});if(error)throw error;
    bar.style.width='100%';
    await boot();
  }catch(e){bar.style.width='0';const m='No se pudo subir: '+(e.message||e);bar.parentElement.querySelector('.err')?.remove();bar.parentElement.append(el('div',{class:'err',style:'position:absolute;left:6px;right:6px;bottom:10px;z-index:5;background:#fff;color:#c0262d;border:2px solid #c0262d;border-radius:10px;padding:6px 8px;font-size:12px;font-weight:700'},m));try{alert(m)}catch(_){}}
}

const money=n=>'S/ '+Number(n).toLocaleString('es-PE',{maximumFractionDigits:2});
function show(v){$('#app').hidden=v!=='cartas';$('#ventasView').hidden=v!=='ventas';if(v==='ventas')cargarVentas()}
$('#vCartas').onclick=()=>show('cartas');$('#vVentas').onclick=()=>show('ventas');
async function cargarVentas(){
  const box=$('#ventasView');const{data,error}=await sb.rpc('admin_ventas');
  if(error){box.replaceChildren(el('p',{class:'empty'},'No se pudo cargar: '+error.message));return}
  const ok=data.filter(v=>!v.anulada);const hoyS=new Date().toLocaleDateString('en-CA',{timeZone:'America/Lima'});
  const sum=a=>a.reduce((t,v)=>t+Number(v.precio_venta),0);
  const mes=ok.filter(v=>v.fecha.slice(0,7)===hoyS.slice(0,7));
  const csv=()=>{const h=['fecha','carta','empresa','grado','precio_venta','canal','cliente','nota','anulada'];const q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';
    const t=[h.join(','),...data.map(v=>[v.fecha,v.nombre,v.empresa,v.grado,v.precio_venta,v.canal,v.cliente,v.nota,v.anulada].map(q).join(','))].join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='ventas-cartas.csv';a.click()};
  box.replaceChildren(
    el('div',{class:'kpis'},el('div',{class:'kpi'},'Ventas del mes',el('b',{},money(sum(mes))+' · '+mes.length)),el('div',{class:'kpi'},'Ventas totales',el('b',{},money(sum(ok))+' · '+ok.length)),el('button',{class:'btn',style:'align-self:center',onclick:csv},'Descargar CSV')),
    data.length?el('table',{class:'tbl'},el('tr',{},['Fecha','Carta','Precio','Canal','Cliente / nota',''].map(h=>el('th',{},h))),
